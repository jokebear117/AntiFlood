[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "antiflood"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "numpy>=1.26,<3",
  "pillow>=10,<14",
  "pyshp>=2.3,<4",
  "python-dotenv>=1,<2",
  "rasterio>=1.4,<2",
  "remotezip>=0.12,<1",
  "uvicorn>=0.30,<1",
]

[project.scripts]
antiflood = "antiflood.api:main"
